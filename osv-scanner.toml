# OSV-Scanner configuration for raidy.
#
# No per-advisory waivers are currently in effect. The CI gate fails on any
# OSV finding at LOW severity or above, except for the standing
# development-only-dependency exemption at the bottom of this file.
#
# To waive a finding, add an [[IgnoredVulns]] block below WITH a justification
# and an `ignoreUntil` expiry so waivers are revisited rather than forgotten:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = """
# Why this advisory does not apply to raidy (e.g. unreachable code path,
# fixed range we are already past) — and what to re-check at expiry.
# """

# ---------------------------------------------------------------------------
# Blanket exemption for development-only dependencies.
#
# Policy change (2026-07-26): dev dependencies are build and test tooling. They
# are not resolved, downloaded or executed by anything we ship, so an advisory
# against one does not describe risk in the delivered artifact. Chasing patch
# bumps on transitive tooling we do not control kept the required
# `security / osv-scan` check permanently red and blocked unrelated work.
#
# Production dependencies stay fully gated: findings there are resolved by
# upgrading, never by waiving.
# ---------------------------------------------------------------------------

[[PackageOverrides]]
group = "dev"
vulnerability.ignore = true
reason = "Dev-only dependency: build/test tooling, never shipped in the production bundle"
