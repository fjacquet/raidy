# Dependabot version updates.
#
# `dependabot-automerge.yml` has existed since before this file did, so the merge half of the
# mechanism was in place while nothing produced the PRs it merges — which is why 26 packages had
# drifted behind by 3.1.1 and were swept by hand. Adding this file arms the other half; the
# workflow's guard on update-type is what keeps that from being dangerous.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Patch and minor arrive as ONE pull request. Ten separate green PRs a week train a reviewer
    # to merge without looking, which is precisely the habit that makes an auto-merged major
    # dangerous.
    groups:
      patch-and-minor:
        patterns: ['*']
        update-types: [minor, patch]
      # vitest and @vitest/* pin EXACT peers on each other (@vitest/coverage-v8 declares
      # `peer vitest@"4.1.11"`), so a major bumped one package at a time is unresolvable:
      # the 5.0.0 bump arrived as PRs #168/#169/#170 and each failed `npm ci` with ERESOLVE
      # on its own. Group the family across all update types so a major arrives installable.
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [major, minor, patch]
    # Other majors still come as their own PR, one per package, and the workflow refuses to
    # auto-merge them — grouping here changes how the PR is built, not whether it is reviewed.
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]
